<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tax Tracker{% endblock %}</title>
    <style>
        body { font-family: sans-serif; max-width: 1000px; margin: 40px auto; padding: 0 20px; color: #222; }
        nav { margin-bottom: 30px; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        nav a { margin-right: 16px; text-decoration: none; color: #0066cc; }
        nav a:hover { text-decoration: underline; }
        .flash { background: #ffffcc; border: 1px solid #cca; padding: 8px 12px; margin-bottom: 16px; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #eee; }
        th { background: #f5f5f5; font-weight: 600; }
        .btn { display: inline-block; padding: 8px 16px; background: #0066cc; color: white; text-decoration: none; border: none; cursor: pointer; border-radius: 4px; font-size: 14px; }
        .btn-danger { background: #cc0000; }
        .btn-secondary { background: #666; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        label { display: block; margin-top: 12px; margin-bottom: 4px; font-weight: 600; font-size: 14px; }
        .form-group { margin-bottom: 16px; }
    </style>
</head>
<body>
    {% if current_user.is_authenticated %}
    <nav>
        <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
        <a href="{{ url_for('expenses.list_expenses') }}">Expenses</a>
        <a href="{{ url_for('vendors.list_vendors') }}">Vendors</a>
        <a href="{{ url_for('years.list_years') }}">Financial Years</a>
        <a href="{{ url_for('reports.report') }}">Tax Summary</a>
        <a href="{{ url_for('auth.logout') }}" style="float:right; color:#999;">Logout</a>
    </nav>
    {% endif %}

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>
</html>
